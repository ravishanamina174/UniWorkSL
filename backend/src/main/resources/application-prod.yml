spring:
  flyway:
    connect-retries: ${FLYWAY_CONNECT_RETRIES:10}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
