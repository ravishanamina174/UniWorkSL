spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: uniwork-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1740000}
      data-source-properties:
        sslmode: require
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    connect-retries: 0
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
uniwork:
  web-origin: ${WEB_ORIGIN:http://localhost:3000}
  security:
    clerk-issuer-uri: ${CLERK_ISSUER_URI:}
    clerk-jwks-uri: ${CLERK_JWKS_URI:}
    jwt-audience: ${CLERK_JWT_AUDIENCE:}
    authorized-parties: ${CLERK_AUTHORIZED_PARTIES:${WEB_ORIGIN:http://localhost:3000}}
    clerk-secret-key: ${CLERK_SECRET_KEY:}
    clerk-api-url: ${CLERK_API_URL:https://api.clerk.com/v1}
  pii:
    encryption-key: ${UNIWORK_PII_ENCRYPTION_KEY:}
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.6-flash}
  admin:
    watchlist-low-rating-threshold: ${WATCHLIST_LOW_RATING_THRESHOLD:2}
    watchlist-serious-report-threshold: ${WATCHLIST_SERIOUS_REPORT_THRESHOLD:2}
  identity:
    r2-account-id: ${R2_ACCOUNT_ID:}
    r2-access-key-id: ${R2_ACCESS_KEY_ID:}
    r2-secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    r2-bucket-name: ${R2_BUCKET_NAME:uniwork-identity}
    r2-endpoint: ${R2_ENDPOINT:}
    review-retention-days: ${IDENTITY_REVIEW_RETENTION_DAYS:30}
    orphan-grace-days: ${IDENTITY_ORPHAN_GRACE_DAYS:45}
    tesseract-command: ${IDENTITY_TESSERACT_COMMAND:tesseract}
    ocr-concurrency: ${IDENTITY_OCR_CONCURRENCY:1}
    ocr-timeout-ms: ${IDENTITY_OCR_TIMEOUT_MS:15000}
