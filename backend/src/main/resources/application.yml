spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: uniwork-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1740000}
      data-source-properties:
        sslmode: require
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    connect-retries: 0
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
uniwork:
  web-origin: ${WEB_ORIGIN:http://localhost:3000}
  security:
    clerk-issuer-uri: ${CLERK_ISSUER_URI:}
    clerk-jwks-uri: ${CLERK_JWKS_URI:}
    jwt-audience: ${CLERK_JWT_AUDIENCE:}
    authorized-parties: ${CLERK_AUTHORIZED_PARTIES:${WEB_ORIGIN:http://localhost:3000}}
  pii:
    encryption-key: ${UNIWORK_PII_ENCRYPTION_KEY:}
