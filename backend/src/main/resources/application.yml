spring:
  application:
    name: uniwork-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uniwork}
    username: ${DB_USERNAME:uniwork}
    password: ${DB_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    connect-retries: 0
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
uniwork:
  web-origin: ${WEB_ORIGIN:http://localhost:3000}
  security:
    clerk-issuer-uri: ${CLERK_ISSUER_URI:}
    clerk-jwks-uri: ${CLERK_JWKS_URI:}
    jwt-audience: ${CLERK_JWT_AUDIENCE:}
    authorized-parties: ${CLERK_AUTHORIZED_PARTIES:${WEB_ORIGIN:http://localhost:3000}}
  pii:
    encryption-key: ${UNIWORK_PII_ENCRYPTION_KEY:}
